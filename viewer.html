<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;">
    <title>LIM Viewer</title>

    <script src="libs/marked.min.js"></script>

    <link rel="stylesheet" href="libs/katex.min.css">
    <script defer src="libs/katex.min.js"></script>
    <script defer src="libs/auto-render.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            line-height: 1.6;
            margin: 0;
            padding: 20px 5%;
            padding-bottom: 15px;
        }
        #output {
            max-width: 100%;
            margin: auto;
        }
        #output > [data-seg] > :first-child { margin-top: 0; }
        pre {
            background-color: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 12em;
            overflow-y: auto;
        }
        code {
            font-family: "Fira Code", "Consolas", monospace;
            background-color: #2d2d2d;
            padding: 2px 4px;
            border-radius: 4px;
        }
        pre code {
            background-color: transparent;
            padding: 0;
            white-space: pre;
        }
        blockquote {
            border-left: 4px solid #569cd6;
            margin: 0;
            padding-left: 15px;
            color: #9cdcfe;
        }
        /* Top-right controls bar */
        .controls-bar {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 9999;
        }
        .status {
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            font-family: monospace;
            white-space: nowrap;
            z-index: 9999;
        }
        .connected { background-color: #28a745; color: black; font-weight: bold; }
        .disconnected { background-color: #dc3545; color: white; }

        /* Export button */
        .export-btn {
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            line-height: 1;
        }
        .export-btn:hover {
            opacity: 0.7;
        }

        /* Tool label / result styling (sent as raw HTML from C++) */
        .tool-label {
            color: #ce9178;
            font-weight: bold;
            margin: 12px 0 4px 0;
            font-size: 0.95em;
        }
        .tool-error {
            color: #f48771;
            margin: 12px 0;
            padding: 10px 15px;
            background-color: #3a1e1e;
            border-radius: 6px;
            border-left: 4px solid #f48771;
        }
        .tool-error pre {
            margin: 8px 0 0 0;
            font-size: 0.85em;
        }
        .tool-result {
            color: #b5cea8;
            margin: 12px 0;
            padding: 10px 15px;
            background-color: #1e3a1e;
            border-radius: 6px;
            border-left: 4px solid #888;
        }
        .tool-result pre {
            margin: 8px 0 0 0;
            font-size: 0.85em;
            max-height: 400px;
            overflow-y: auto;
        }

        /* Think block styling */
        .think-block {
            margin: 12px 0;
            border-radius: 6px;
            border-left: 4px solid #8545c9;
            background-color: #2a1e3a;
            overflow: hidden;
        }
        .think-header {
            display: flex;
            align-items: center;
            padding: 6px 15px;
            cursor: pointer;
            user-select: none;
            color: #c4a5e8;
            font-weight: bold;
            font-size: 0.9em;
            background-color: #352548;
        }
        .think-header:hover {
            background-color: #403060;
        }
        .think-header .arrow {
            margin-right: 8px;
            font-size: 0.8em;
        }
        .think-header.collapsed .arrow {
            transform: rotate(-90deg);
        }
        .think-body {
            padding: 10px 15px;
            color: #b8a0d8;
            font-size: 0.9em;
            line-height: 1.6;
        }
        .think-body > :first-child { margin-top: 0; }
        .think-body > :last-child { margin-bottom: 0; }
        .think-body.hidden {
            display: none;
        }

        .think-body pre {
            background-color: #352548;
        }

        /* Copy button on code blocks */
        pre {
            position: relative;
        }
        .code-block-wrapper {
            position: relative;
            margin: 4px 0;
        }
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 16px;
            padding: 4px 10px;
            font-size: 0.75em;
            font-family: inherit;
            color: #d4d4d4;
            background-color: #3c3c3c;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s, background-color 0.2s;
            z-index: 10;
        }
        .copy-btn:hover {
            opacity: 1;
            background-color: #505050;
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <div id="status" class="status disconnected">Disconnected</div>
        <button class="export-btn" title="Export session as HTML">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4ade69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><polyline points="7 11 12 16 17 11"/><path d="M4 21h16"/></svg>
        </button>
    </div>
    <div id="output"></div>

    <script src="viewer.js"></script>
</body>
</html>
